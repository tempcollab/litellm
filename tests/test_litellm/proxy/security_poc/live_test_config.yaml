## Minimal LiteLLM proxy config for security testing.
## Start with:
##   litellm --config tests/test_litellm/proxy/security_poc/live_test_config.yaml
##
## Or:
##   LITELLM_MASTER_KEY=sk-test-master-key-1234 \
##   DATABASE_URL=sqlite:///tmp/litellm_security_test.db \
##   litellm --config tests/test_litellm/proxy/security_poc/live_test_config.yaml --port 14000

model_list:
  - model_name: fake-model
    litellm_params:
      model: openai/fake
      api_key: sk-fake-not-real
      api_base: http://localhost:1/v1  # intentionally unreachable

general_settings:
  master_key: sk-test-master-key-1234
  database_url: sqlite:///tmp/litellm_security_test.db

litellm_settings:
  callbacks: ["prometheus"]
